<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Icon -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Main Ribbon Gradient -->
    <linearGradient id="logoRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="35%" stop-color="#6366F1" />
      <stop offset="70%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Text Gradient for AI -->
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
  </defs>

  <!-- ICON EMBLEM -->
  <g transform="translate(16, 16)">
    <!-- Rounded squircle badge -->
    <rect x="0" y="0" width="128" height="128" rx="34" ry="34" fill="url(#logoBgGrad)" stroke="#8B5CF6" stroke-width="2.5" />

    <!-- Speech bubble + 'S' -->
    <path d="M 68 22
             C 92 22 110 38 110 60
             C 110 74 102 85 92 92
             L 98 108
             L 80 101
             C 76 102 72 103 68 103
             C 44 103 26 86 26 63
             C 26 42 42 27 62 23
             L 68 22 Z"
          fill="url(#logoRibbon)" />

    <!-- Negative 'S' cut -->
    <path d="M 66 36
             C 52 36 46 44 46 52
             C 46 60 54 64 68 68
             C 82 72 88 78 88 86
             C 88 94 78 98 66 98
             C 54 98 46 92 44 84
             L 54 82
             C 56 86 60 90 66 90
             C 72 90 78 87 78 82
             C 78 76 72 72 60 68
             C 46 64 36 58 36 48
             C 36 38 46 28 64 28
             C 74 28 82 32 86 38
             L 78 44
             C 76 40 72 36 66 36 Z"
          fill="#FFFFFF" />

    <!-- AI Sparkle -->
    <path d="M 98 16 Q 98 26 88 26 Q 98 26 98 36 Q 98 26 108 26 Q 98 26 98 16 Z"
          fill="#38BDF8" />
  </g>

  <!-- TYPOGRAPHY WORDMARK -->
  <g transform="translate(164, 40)">
    <!-- SpeakUp AI -->
    <text x="0" y="52" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="54" font-weight="900" letter-spacing="-0.03em" fill="#0F172A" class="dark:fill-white">
      SpeakUp
    </text>

    <!-- AI Radiant Pill Badge -->
    <g transform="translate(244, 4)">
      <rect x="0" y="6" width="76" height="48" rx="14" ry="14" fill="url(#aiGrad)" />
      <text x="38" y="40" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.05em">
        AI
      </text>
    </g>

    <!-- Professional Tagline -->
    <text x="2" y="86" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14.5" font-weight="600" letter-spacing="0.01em" fill="#64748B">
      Speak English. Build Confidence. Transform Your Future.
    </text>
  </g>
</svg>
