<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer Speech Bubble / Sound Wave Aura -->
  <circle cx="256" cy="230" r="160" fill="none" stroke="#ffffff" stroke-width="12" stroke-opacity="0.2" />
  <circle cx="256" cy="230" r="190" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.1" />

  <!-- Central Speech Bubble -->
  <g filter="url(#glow)">
    <path d="M 160 140 C 120 140, 90 170, 90 215 C 90 270, 140 310, 200 310 L 200 360 L 260 310 C 330 310, 390 265, 390 215 C 390 170, 350 140, 280 140 Z" fill="#ffffff" />
    
    <!-- Microphone / Sound Waves inside bubble -->
    <!-- Mic Body -->
    <rect x="236" y="180" width="40" height="60" rx="20" fill="#4f46e5" />
    <path d="M 218 215 C 218 245, 294 245, 294 215" fill="none" stroke="#4f46e5" stroke-width="10" stroke-linecap="round" />
    <line x1="256" y1="245" x2="256" y2="270" stroke="#4f46e5" stroke-width="10" stroke-linecap="round" />
    <line x1="236" y1="270" x2="276" y2="270" stroke="#4f46e5" stroke-width="10" stroke-linecap="round" />
  </g>

  <!-- Sparkle Accent in top right -->
  <path d="M 380 100 Q 400 120 420 120 Q 400 120 380 140 Q 380 120 360 120 Q 380 120 380 100 Z" fill="url(#starGrad)" />

  <!-- SpeakUp text pill at bottom -->
  <rect x="140" y="400" width="232" height="54" rx="27" fill="#ffffff" fill-opacity="0.9" />
  <text x="256" y="437" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="26" fill="#4338ca" letter-spacing="1.5">SPEAKUP AI</text>
</svg>
