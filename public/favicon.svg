<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="favRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="40%" stop-color="#4F46E5" />
      <stop offset="80%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="favSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="4" y="4" width="120" height="120" rx="32" ry="32" fill="url(#favBg)" stroke="#8B5CF6" stroke-width="2.5" />

  <!-- Bold Simplified S + Speech Bubble for Favicon Clarity -->
  <path d="M 68 26
           C 90 26 106 42 106 63
           C 106 75 99 85 90 92
           L 96 106
           L 80 100
           C 76 101 72 102 68 102
           C 46 102 30 86 30 65
           C 30 45 44 32 62 27
           L 68 26 Z"
        fill="url(#favRibbon)" />

  <!-- Inner Negative 'S' Dynamic Curve -->
  <path d="M 66 40
           C 52 40 46 48 46 56
           C 46 64 54 68 68 72
           C 82 76 88 82 88 90
           C 88 98 78 102 66 102
           C 54 102 46 96 44 88
           L 54 86
           C 56 90 60 94 66 94
           C 72 94 78 91 78 86
           C 78 80 72 76 60 72
           C 46 68 36 62 36 52
           C 36 42 46 32 64 32
           C 74 32 82 36 86 42
           L 78 48
           C 76 44 72 40 66 40 Z"
        fill="#FFFFFF" />

  <!-- AI Sparkle at Top Right -->
  <path d="M 96 18 Q 96 28 86 28 Q 96 28 96 38 Q 96 28 106 28 Q 96 28 96 18 Z"
        fill="url(#favSpark)" />
</svg>
