<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="maskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <linearGradient id="maskRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="35%" stop-color="#6366F1" />
      <stop offset="70%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="maskRibbon2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="40%" stop-color="#3B82F6" />
      <stop offset="75%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <filter id="maskShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4F46E5" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full bleed background for maskable circle/squircle cutting -->
  <rect width="512" height="512" fill="url(#maskBg)" />

  <!-- Content scaled and centered strictly within the 80% safe zone (center 400x400) -->
  <g transform="translate(256, 256) scale(0.72) translate(-256, -256)" filter="url(#maskShadow)">
    <!-- Speech bubble & Upper 'S' -->
    <path d="M 276 96
             C 362 96 424 158 424 240
             C 424 286 400 326 364 354
             L 384 416
             L 322 392
             C 307 397 292 400 276 400
             C 246 400 220 392 198 378
             L 228 344
             C 242 352 258 356 276 356
             C 334 356 376 312 376 250
             C 376 194 336 148 276 148
             C 214 148 168 184 154 238
             L 108 226
             C 126 150 190 96 276 96 Z"
          fill="url(#maskRibbon)" />

    <!-- Lower loop of 'S' -->
    <path d="M 152 232
             C 160 214 176 198 196 186
             L 224 220
             C 210 228 202 238 198 250
             C 192 270 204 290 226 304
             L 268 330
             C 316 360 338 394 330 432
             C 322 470 286 496 234 496
             C 162 496 104 446 96 374
             L 142 364
             C 148 412 186 450 234 450
             C 260 450 280 436 284 416
             C 288 396 274 378 248 362
             L 204 334
             C 160 306 144 268 152 232 Z"
          fill="url(#maskRibbon2)" />

    <!-- AI Sparkle -->
    <g transform="translate(378, 114)">
      <path d="M 0 -48 Q 0 0 -48 0 Q 0 0 0 48 Q 0 0 48 0 Q 0 0 0 -48 Z"
            fill="url(#sparkGrad)" />
      <circle cx="0" cy="0" r="10" fill="#FFFFFF" />
    </g>
  </g>
</svg>
