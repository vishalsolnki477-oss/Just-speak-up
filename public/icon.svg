<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Outer Squircle Glow -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.6" />
    </linearGradient>

    <!-- Ribbon Gradient: Purple -> Electric Blue -> Cyan -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="35%" stop-color="#6366F1" />
      <stop offset="70%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Reverse Ribbon Gradient for S-curve depth -->
    <linearGradient id="ribbonGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="40%" stop-color="#3B82F6" />
      <stop offset="75%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- AI Sparkle Radiant Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4F46E5" flood-opacity="0.45" />
    </filter>

    <!-- Glow for AI Sparkle -->
    <filter id="sparkleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle with Rounded Corners -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)" stroke="url(#borderGlow)" stroke-width="6" />

  <!-- Subtle ambient inner glow ring -->
  <rect x="28" y="28" width="456" height="456" rx="100" ry="100" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="2" />

  <!-- SPEECH BUBBLE + ELEGANT 'S' EMBLEM -->
  <g filter="url(#shadow)">
    <!-- Main Speech Bubble Silhouette & Upper S Loop -->
    <path d="M 276 96
             C 362 96 424 158 424 240
             C 424 286 400 326 364 354
             L 384 416
             L 322 392
             C 307 397 292 400 276 400
             C 246 400 220 392 198 378
             L 228 344
             C 242 352 258 356 276 356
             C 334 356 376 312 376 250
             C 376 194 336 148 276 148
             C 214 148 168 184 154 238
             L 108 226
             C 126 150 190 96 276 96 Z"
          fill="url(#ribbonGrad)" />

    <!-- The Lower Intersecting Loop of 'S' Flowing Out with Energy -->
    <path d="M 152 232
             C 160 214 176 198 196 186
             L 224 220
             C 210 228 202 238 198 250
             C 192 270 204 290 226 304
             L 268 330
             C 316 360 338 394 330 432
             C 322 470 286 496 234 496
             C 162 496 104 446 96 374
             L 142 364
             C 148 412 186 450 234 450
             C 260 450 280 436 284 416
             C 288 396 274 378 248 362
             L 204 334
             C 160 306 144 268 152 232 Z"
          fill="url(#ribbonGrad2)" />

    <!-- Elegant Center Diagonal Bridging the 'S' Rhythm -->
    <path d="M 188 228
             C 220 204 266 210 292 238
             L 264 268
             C 248 250 222 246 204 260
             Z"
          fill="#38BDF8"
          opacity="0.9" />
  </g>

  <!-- AI INTELLIGENCE SPARKLE (Four-Pointed Star with Radiant Core) -->
  <g transform="translate(378, 114)" filter="url(#sparkleGlow)">
    <!-- Outer Glow Diamond -->
    <path d="M 0 -48 Q 0 0 -48 0 Q 0 0 0 48 Q 0 0 48 0 Q 0 0 0 -48 Z"
          fill="url(#sparkleGrad)" />
    <!-- Inner Core Bright Star -->
    <circle cx="0" cy="0" r="10" fill="#FFFFFF" />
  </g>

  <!-- Secondary Micro-Sparkle (Subtle Learning Accents) -->
  <g transform="translate(132, 142) scale(0.42)">
    <path d="M 0 -36 Q 0 0 -36 0 Q 0 0 0 36 Q 0 0 36 0 Q 0 0 0 -36 Z"
          fill="#67E8F9" opacity="0.85" />
  </g>
</svg>
